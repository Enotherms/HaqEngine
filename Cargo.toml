[workspace]
resolver = "2"
members = ["crates/haqengine-core", "crates/haqengine-layer", "crates/haqengine-shaders", "crates/haqengine-gpu-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "BSD-3-Clause AND MIT"
repository = "https://github.com/Enotherms/HaqEngine"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
